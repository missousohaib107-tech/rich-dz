<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>RICH DZ film</title>
<style>
/* Motion-graphics films for RICH DZ, built as a page and filmed frame by frame (see render.py).
   Every animation is plain CSS; seek(scene, t) pauses them and sets their clock, so a frame
   depends only on its time. Text sits straight on the ground, never on a plate. */
@font-face { font-family: "Reem Kufi"; src: url("../node_modules/@fontsource-variable/reem-kufi/files/reem-kufi-arabic-wght-normal.woff2") format("woff2"); font-weight: 400 700; unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF, U+200C-200F; }
@font-face { font-family: "Reem Kufi"; src: url("../node_modules/@fontsource-variable/reem-kufi/files/reem-kufi-latin-wght-normal.woff2") format("woff2"); font-weight: 400 700; unicode-range: U+0000-00FF; }
@font-face { font-family: "Cairo"; src: url("../node_modules/@fontsource-variable/cairo/files/cairo-arabic-wght-normal.woff2") format("woff2"); font-weight: 200 1000; unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF, U+200C-200F; }
@font-face { font-family: "Cairo"; src: url("../node_modules/@fontsource-variable/cairo/files/cairo-latin-wght-normal.woff2") format("woff2"); font-weight: 200 1000; unicode-range: U+0000-00FF, U+2010-2027; }
@font-face { font-family: "Plex Mono"; src: url("../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-600-normal.woff2") format("woff2"); font-weight: 600; }

:root {
  --ground: #121317; --surface: #1b1d22; --raised: #2a2d35; --line: #3a3e48;
  --ink: #f3f1ec; --muted: #a7aab2; --gold: #e3b04b; --gold-ink: #1a1408;
  --out: cubic-bezier(.16, 1, .3, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #000; }
#stage {
  position: relative; width: 1080px; height: 1920px; overflow: hidden;
  background:
    radial-gradient(900px 700px at 100% 0%, rgba(227, 176, 75, .13), transparent 70%),
    radial-gradient(800px 800px at 0% 100%, rgba(227, 176, 75, .06), transparent 70%),
    var(--ground);
  color: var(--ink); font-family: "Cairo", sans-serif; font-weight: 700; direction: rtl;
}
.scene { position: absolute; inset: 0; display: none; padding: 170px 90px 330px; }
.scene.on { display: block; animation: drift calc(var(--dur) * 1s) linear both; }
.inner { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 46px;
  animation: sceneOut .4s cubic-bezier(.6, 0, .9, .4) both; animation-delay: calc(var(--dur) * 1s - .4s); }
.scene.last .inner { animation: none; }

@keyframes drift { from { transform: scale(1); } to { transform: scale(1.035); } }
@keyframes sceneOut { to { opacity: 0; transform: translateY(-70px); } }
@keyframes inUp { from { opacity: 0; transform: translateY(80px); } to { opacity: 1; transform: none; } }
@keyframes inPop { 0% { opacity: 0; transform: scale(.55); } 60% { opacity: 1; transform: scale(1.07); } 100% { opacity: 1; transform: scale(1); } }
@keyframes inFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes cellOn { from { background: var(--raised); transform: scaleY(.55); } to { background: var(--gold); transform: none; } }
@keyframes rowOn { from { border-color: var(--line); color: var(--muted); background: transparent; }
  to { border-color: var(--gold); color: var(--gold); background: rgba(227, 176, 75, .12); } }
@keyframes tap { 0% { opacity: 0; transform: scale(.2); } 25% { opacity: .9; } 100% { opacity: 0; transform: scale(1.7); } }
@keyframes draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
@keyframes strike { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.up, .pop, .fade, .w { animation-fill-mode: both; animation-delay: var(--d, 0s); }
.up, .w { animation-name: inUp; animation-duration: .8s; animation-timing-function: var(--out); }
.pop { animation-name: inPop; animation-duration: .6s; animation-timing-function: var(--out); }
.fade { animation-name: inFade; animation-duration: .6s; animation-timing-function: ease-out; }
.w { display: inline-block; }

.wordmark { font-family: "Plex Mono", monospace; font-weight: 600; letter-spacing: .28em; color: var(--gold); direction: ltr; font-size: 46px; }
.display { font-family: "Reem Kufi", sans-serif; font-weight: 700; line-height: 1.3; }
.huge { font-size: 204px; }
.big { font-size: 140px; }
.head { font-size: 98px; line-height: 1.35; }
.body { font-size: 66px; line-height: 1.55; }
.hint { font-size: 54px; line-height: 1.55; color: var(--muted); font-weight: 600; }
.tut { font-family: "Cairo", sans-serif; font-weight: 800; font-size: 90px; line-height: 1.38; }
.gold { color: var(--gold); }
.display, .head, .body, .hint, .tut { text-wrap: balance; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
.rule { height: 8px; width: 300px; background: var(--gold); border-radius: 4px; transform-origin: right;
  animation: grow .7s var(--out) both; animation-delay: var(--d, 0s); }

/* a week: seven cells, one per day */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 16px; }
.cell { height: 58px; border-radius: 12px; background: var(--raised); }
.cell.on { animation: cellOn .45s var(--out) both; animation-delay: var(--d, 0s); }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 16px; font-size: 42px; color: var(--muted); text-align: center; font-weight: 600; }

/* posters dropping into the week */
.shots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; direction: rtl; }
.shot { aspect-ratio: 9 / 16; border-radius: 22px; overflow: hidden; border: 3px solid var(--line); background: #000; position: relative; }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shot b { position: absolute; top: 10px; right: 10px; width: 58px; height: 58px; border-radius: 50%; background: var(--gold); color: var(--gold-ink);
  display: grid; place-items: center; font-size: 32px; font-weight: 800; }

.price { display: flex; align-items: baseline; gap: 24px; direction: rtl; }
.price .num { font-size: 214px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.price .unit { font-size: 84px; font-weight: 800; }

.steps { display: flex; flex-direction: column; gap: 46px; }
.step { display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 30px; }
.step i { font-style: normal; font-family: "Reem Kufi", sans-serif; font-size: 130px; line-height: 1; color: var(--gold); text-align: center; }
.step span { font-size: 68px; line-height: 1.45; }

.empty { position: relative; display: inline-block; }
.empty::after { content: ""; position: absolute; right: -10px; left: -10px; top: 54%; height: 12px; border-radius: 6px; background: var(--gold);
  transform-origin: right; animation: strike .5s var(--out) both; animation-delay: var(--d, 0s); }

/* tutorial phone: a neutral list of menu rows, not any app's real screen */
.phone { align-self: center; width: 880px; border: 6px solid var(--line); border-radius: 84px; background: var(--surface); padding: 54px 46px 62px;
  display: flex; flex-direction: column; gap: 26px; }
.phone::before { content: ""; align-self: center; width: 190px; height: 16px; border-radius: 8px; background: var(--line); margin-bottom: 14px; }
.row { position: relative; min-height: 150px; line-height: 1.35; padding-block: 24px; border: 5px solid var(--line); border-radius: 32px; display: flex; align-items: center; padding: 0 44px;
  font-size: 60px; color: var(--muted); }
.row.hi { animation: rowOn .45s ease-out both; animation-delay: var(--d, 0s); }
.row .tap { position: absolute; left: 40px; top: 50%; width: 110px; height: 110px; margin-top: -55px; border-radius: 50%;
  border: 6px solid var(--gold); animation: tap .9s ease-out both; animation-delay: var(--d, 0s); }
.count { font-family: "Reem Kufi", sans-serif; font-size: 112px; line-height: 1; color: var(--gold); direction: ltr; text-align: right; }
.check { width: 300px; height: 300px; }
.check circle, .check path { fill: none; stroke: var(--gold); stroke-width: 14; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: var(--len); animation: draw .8s var(--out) both; animation-delay: var(--d, 0s); }
.center { align-items: center; text-align: center; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="films.js"></script>
<script>
const stage = document.getElementById("stage");
const key = new URLSearchParams(location.search).get("v") || "intro";
const film = FILMS[key];

film.scenes.forEach((s, i) => {
  const el = document.createElement("section");
  el.className = "scene" + (i === film.scenes.length - 1 ? " last" : "");
  el.style.setProperty("--dur", s.dur);
  el.innerHTML = s.html;
  stage.appendChild(el);
});
const scenes = [...stage.children];

const easeOut = (x) => 1 - Math.pow(1 - x, 3);

// Show scene i at t seconds into it. Returns once the frame is painted.
window.seek = async (i, t) => {
  scenes.forEach((el, k) => el.classList.toggle("on", k === i));
  const el = scenes[i];
  for (const a of el.getAnimations({ subtree: true })) { a.pause(); a.currentTime = t * 1000; }
  for (const n of el.querySelectorAll("[data-to]")) {
    const from = +n.dataset.from || 0, to = +n.dataset.to, at = +n.dataset.at || 0, len = +n.dataset.len || 1;
    const p = Math.min(1, Math.max(0, (t - at) / len));
    n.textContent = Math.round(from + (to - from) * easeOut(p)).toLocaleString("en-US");
  }
  await new Promise((r) => requestAnimationFrame(r));
};

window.filmInfo = { scenes: film.scenes.map((s) => s.dur), cues: film.scenes.map((s) => s.cues || []) };
window.ready = Promise.all([
  document.fonts.ready,
  ...[...document.images].map((im) => im.decode().catch(() => {})),
]).then(() => document.fonts.load('700 100px "Reem Kufi"', "محتوى")).then(() => document.fonts.load('700 50px "Cairo"', "محتوى"));
</script>
</body>
</html>
