name: Keep database awake

# Supabase pauses free projects that see little activity over a week.
# A few small requests a day keep the orders database running.
on:
  schedule:
    - cron: "17 6,14,22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # only the two small folders the script needs, not the videos
          sparse-checkout: |
            src
            scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/keepalive.mjs
